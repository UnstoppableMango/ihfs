name: ghfs

on:
  push:
    branches: [main]
    paths: [ghfs/**]
  pull_request:
    branches: [main]
    paths:
      - ghfs/**
      - .github/workflows/ghfs.yml
      - flake.nix
      - flake.lock
      - go.mk

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@3ec4ed5a6af9c00f6a39e079df488573c77ebda6 # v1.0.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix develop -c make -C ghfs coverprofile.out

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: true
          files: ghfs/coverprofile.out
          flags: ghfs
