name: ctrfs

on:
  push:
    branches: [main]
    paths: [ctrfs/**]
  pull_request:
    branches: [main]
    paths:
      - ctrfs/**
      - .github/workflows/ctrfs.yml
      - flake.nix
      - flake.lock
      - go.mk

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@56abf92ca6c8e241831118a76b7b2ce1d3b8d414 # v1.1.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix develop -c make -C ctrfs coverprofile.out

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: true
          files: ctrfs/coverprofile.out
          flags: ctrfs
