name: mockfs

on:
  push:
    branches: [main]
    paths: [mockfs/**]
  pull_request:
    branches: [main]
    paths:
      - mockfs/**
      - .github/workflows/mockfs.yml
      - flake.nix
      - flake.lock
      - go.mk

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@3ec4ed5a6af9c00f6a39e079df488573c77ebda6 # v1.0.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix develop -c go -C mockfs build -v ./...
