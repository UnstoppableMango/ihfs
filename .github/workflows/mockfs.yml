name: mockfs

on:
  push:
    branches: [main]
    paths: [mockfs/**]
  pull_request:
    branches: [main]
    paths:
      - mockfs/**
      - .github/workflows/mockfs.yml
      - flake.nix
      - flake.lock
      - go.mk

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix develop -c go -C mockfs build -v ./...
